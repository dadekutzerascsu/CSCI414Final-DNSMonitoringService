services:
  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root-local-only
      MONGO_INITDB_DATABASE: dns_monitor
    volumes:
      - mongodb_data:/data/db
      - ../database/mongodb-init.js:/docker-entrypoint-initdb.d/01-init.js:ro
    networks:
      data_net:
        ipv4_address: 172.28.30.20
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ../api
    environment:
      MONGODB_URI: mongodb://dnsapp:dnsapp-local-only@mongodb:27017/dns_monitor?authSource=dns_monitor
      DATABASE_NAME: dns_monitor
    ports:
      - "127.0.0.1:8000:8000"
      - "172.28.10.1:8000:8000"
    volumes:
      - ../data:/data:ro
    networks:
      service_net:
        ipv4_address: 172.28.20.10
      data_net:
        ipv4_address: 172.28.30.10
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  client:
    build:
      context: ..
      dockerfile: docker/client.Dockerfile
    networks:
      client_net:
        ipv4_address: 172.28.10.10
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongodb_data:

networks:
  client_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24
  service_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.20.0/24
  data_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.30.0/24