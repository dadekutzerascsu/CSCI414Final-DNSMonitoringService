#!/usr/sbin/nft -f

flush ruleset

define client_net = 172.28.10.0/24
define service_net = 172.28.20.0/24
define data_net = 172.28.30.0/24

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iifname "lo" accept
    ct state established,related accept
    icmp type echo-request accept
    tcp dport 22 accept
  }

  chain forward {
    type filter hook forward priority 0; policy drop;

    # Permitted client -> API path
    iifname "br-*" ip saddr $client_net ip daddr $service_net tcp dport 8000 accept
    iifname "br-*" ip saddr $service_net ip daddr $client_net tcp sport 8000 ct state established,related accept

    # API -> MongoDB path remains open only on the data segment
    iifname "br-*" ip saddr $service_net ip daddr $data_net tcp dport 27017 accept
    iifname "br-*" ip saddr $data_net ip daddr $service_net tcp sport 27017 ct state established,related accept

    # Explicitly block direct client access to MongoDB
    iifname "br-*" ip saddr $client_net ip daddr $data_net tcp dport 27017 drop
    iifname "br-*" ip saddr $client_net ip daddr $data_net udp dport 27017 drop
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}
